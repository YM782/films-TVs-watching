name: Refresh ranking posters

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-ranking-posters
  cancel-in-progress: false

jobs:
  update-posters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Match IMDb Top 100 with TMDb posters
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          if [ -z "${TMDB_READ_ACCESS_TOKEN:-}" ]; then
            echo "::notice::TMDB_READ_ACCESS_TOKEN is not configured; poster refresh was skipped."
            echo "Add the TMDB_READ_ACCESS_TOKEN repository secret, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/update_ranking_posters.py

      - name: Commit poster manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranking-posters.json
          if git diff --cached --quiet; then
            echo "Poster manifest is unchanged."
          else
            git commit -m "Refresh IMDb ranking poster manifest"
            git push
          fi
